{% extends "shop/base.html" %}

{% block title %}{{ title }} - Namma Chikmagaluru{% endblock %}

{% block content %}
<section class="container form-page">
    <h1>{{ title }}</h1>
    <form method="post" class="address-form-card">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save Address</button>
        <a href="{% url 'shop:profile' %}" class="btn btn-ghost">Cancel</a>
    </form>
</section>
{% endblock %}
