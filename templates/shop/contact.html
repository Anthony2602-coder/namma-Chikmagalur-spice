{% extends "shop/base.html" %}

{% block title %}Contact - Namma Chikmagaluru{% endblock %}

{% block content %}
<section class="container contact-page">
    <h1>Contact Us</h1>
    <div class="contact-grid">
        <div class="contact-info animate-on-scroll">
            <div class="contact-item"><span>📍</span><div><h3>Address</h3><p>Chikmagaluru, Karnataka 577101, India</p></div></div>
            <div class="contact-item"><span>📧</span><div><h3>Email</h3><p>support@nammachikmagaluru.in</p></div></div>
            <div class="contact-item"><span>📞</span><div><h3>Phone</h3><p>+91 98765 43210</p></div></div>
            <div class="contact-item"><span>🕐</span><div><h3>Hours</h3><p>Mon - Sat: 9 AM - 7 PM</p></div></div>
        </div>
        <form class="contact-form animate-on-scroll" onsubmit="event.preventDefault(); alert('Thank you! We will get back to you soon.');">
            <div class="form-group"><label>Name</label><input type="text" class="form-control" required></div>
            <div class="form-group"><label>Email</label><input type="email" class="form-control" required></div>
            <div class="form-group"><label>Message</label><textarea class="form-control" rows="5" required></textarea></div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</section>
{% endblock %}
